# CI — roda em TODO pull request para main.
# 1) lint + testes unitários (Spark local, sem tocar no workspace)
# 2) `bundle validate` contra o workspace de dev
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write # necessário para autenticação OIDC (sem segredos de longa duração)

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar dependências
        run: uv sync --group dev --group local
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Testes unitários
        run: uv run pytest --cov --cov-report=term-missing

  validar-bundle:
    runs-on: ubuntu-latest
    needs: testes
    environment: dev
    env:
      # Workload Identity Federation (OIDC): nenhum token salvo no GitHub
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: databricks/setup-cli@main
      - name: databricks bundle validate
        run: databricks bundle validate -t staging --var="run_as_sp=${{ vars.DATABRICKS_CLIENT_ID }}"

# Lakeflow Job que orquestra: pipeline → checagens de qualidade (wheel).
# Boas práticas:
#  - Lógica em wheel versionado (python_wheel_task), não em notebook
#  - Serverless com `environment_key` (obrigatório para wheel em serverless)
#  - Parâmetros de job (catalog/schema) em vez de valores fixos
#  - Retry, timeout e alertas definidos como código
resources:
  jobs:
    contas_medicas_job:
      name: contas_medicas_job
      max_concurrent_runs: 1
      timeout_seconds: 7200

      schedule:
        quartz_cron_expression: "0 0 6 * * ?" # 06:00 diário (pausado em dev)
        timezone_id: America/Sao_Paulo

      email_notifications:
        on_failure:
          - ${var.notification_email}

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: atualizar_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.contas_medicas_pipeline.id}
            full_refresh: false

        - task_key: checagens_qualidade
          depends_on:
            - task_key: atualizar_pipeline
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: contas_medicas
            entry_point: checagens
            named_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl

[project]
name = "contas_medicas"
version = "0.1.0"
description = "Pipeline medalhão de contas médicas — projeto-modelo de boas práticas no Databricks"
readme = "README.md"
requires-python = ">=3.11"
# Dependências de RUNTIME. pyspark NÃO entra aqui: o Databricks já fornece.
dependencies = []

[project.scripts]
# Entry point usado pelo python_wheel_task (resources/contas_medicas.job.yml)
checagens = "contas_medicas.checks:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "pre-commit>=3",
]
# Escolha UM dos dois grupos abaixo (não instale juntos):
local = ["pyspark>=4.0,<4.1"]                 # Spark local, sem workspace
remote = ["databricks-connect>=17,<18"]       # Spark no serverless do workspace

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contas_medicas"]

# ---------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"

[tool.coverage.run]
source = ["src/contas_medicas"]

# ------------------------------------------------------------------ ruff ----
[tool.ruff]
line-length = 120
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL", "N"]
# N812: `functions as F` é a convenção PySpark; PLC0415: imports tardios são
# intencionais no conftest (Spark local vs. Databricks Connect)
ignore = ["PLR2004", "N999", "N812", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
# Arquivos de pipeline e notebooks recebem `spark`/`dbutils`/`display` do runtime
"src/pipelines/**" = ["F821"]
"src/notebooks/**" = ["F821", "E402"]
"tests/**" = ["PLR0913"]

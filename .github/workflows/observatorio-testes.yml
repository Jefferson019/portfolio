name: Observatório — testes

on:
  push:
    paths:
      - "datascience/prj_observatorio_saude_suplementar/**"
      - ".github/workflows/observatorio-*.yml"
  pull_request:
    paths:
      - "datascience/prj_observatorio_saude_suplementar/**"
      - ".github/workflows/observatorio-*.yml"

defaults:
  run:
    working-directory: datascience/prj_observatorio_saude_suplementar

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: datascience/prj_observatorio_saude_suplementar/pyproject.toml
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Testes (espelho sintético do portal da ANS, sem acesso à internet)
        run: pytest -q
